<div class="fixed inset-0 z-50 overflow-y-auto animate-fade-in" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 transition-opacity" style="background:rgba(0,0,0,0.85); backdrop-filter:blur(10px)" (click)="onClose()"></div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom fn-card text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl sm:w-full p-1 animate-slide-up"
         style="background:var(--theme-surface); border:1px solid var(--theme-border)">
      
      <div class="rounded-2xl px-8 pt-8 pb-10" style="background:var(--theme-surface)">
        
        <!-- Modal Header -->
        <div class="sm:flex sm:items-start mb-8 text-center sm:text-left">
          <div class="mx-auto flex-shrink-0 flex items-center justify-center h-14 w-14 rounded-[1.5rem] sm:mx-0 shadow-glow"
               style="background:rgba(255,215,0,0.1); border:1px solid rgba(255,215,0,0.2)">
            <lucide-angular [img]="editNote ? icons.Edit2 : icons.Plus" class="h-6 w-6 text-accent"></lucide-angular>
          </div>
          <div class="mt-4 sm:mt-0 sm:ml-5 flex-1" [class.text-end]="i18n.currentLang === 'ar'">
            <h3 class="text-2xl font-black tracking-tight" style="color:var(--theme-text)">
              {{ editNote ? t('common.edit') : t('journal.add') }}
            </h3>
            <p class="text-xs font-bold uppercase tracking-widest opacity-40 mt-1">Analytical Reflection</p>
          </div>
        </div>
        
        <form [formGroup]="journalForm" (ngSubmit)="onSubmit()" class="space-y-6" [dir]="i18n.currentLang === 'ar' ? 'rtl' : 'ltr'">
          
          <!-- Title -->
          <div class="space-y-2">
            <label class="block text-[10px] font-black uppercase tracking-widest" style="color:var(--theme-muted)">{{ t('journal.field.title') }}</label>
            <input type="text" formControlName="title" class="luxury-input !py-4 font-bold text-lg" placeholder="Daily Recap...">
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Linked Trade -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest" style="color:var(--theme-muted)">{{ t('journal.field.link') }}</label>
                <select formControlName="tradeId" class="luxury-input !py-4 font-bold">
                    <option value="">-- No Link --</option>
                    <option *ngFor="let t of trades$ | async" [value]="t.id">{{ t.symbol }} ({{ t.type }} {{ t.date | date:'MMM d' }})</option>
                </select>
            </div>
            <!-- Emotion -->
            <div class="space-y-2">
                <label class="block text-[10px] font-black uppercase tracking-widest" style="color:var(--theme-muted)">{{ t('journal.field.emotions') }}</label>
                <select formControlName="emotion" class="luxury-input !py-4 font-bold">
                    <option *ngFor="let emp of emotions" [value]="emp">{{ emp }}</option>
                </select>
            </div>
          </div>

          <!-- Mistakes -->
          <div class="space-y-3">
              <label class="block text-[10px] font-black uppercase tracking-widest" style="color:var(--theme-muted)">{{ t('journal.field.mistakes') }}</label>
              <div class="grid grid-cols-2 gap-3">
                <div *ngFor="let m of mistakesOptions" 
                     (click)="toggleMistake(m, {target: {checked: !hasMistake(m)}})"
                     class="flex items-center gap-3 p-4 rounded-2xl cursor-pointer transition-all border"
                     [style.background]="hasMistake(m) ? 'rgba(239,68,68,0.1)' : 'rgba(255,255,255,0.02)'"
                     [style.border-color]="hasMistake(m) ? '#ef4444' : 'var(--theme-border)'">
                  <div class="w-4 h-4 rounded-md border flex items-center justify-center transition-all"
                       [style.background]="hasMistake(m) ? '#ef4444' : 'transparent'"
                       [style.border-color]="hasMistake(m) ? '#ef4444' : 'var(--theme-muted)'">
                    <lucide-angular *ngIf="hasMistake(m)" [img]="icons.Check" class="w-3 h-3 text-white"></lucide-angular>
                  </div>
                  <span class="text-xs font-bold" [style.color]="hasMistake(m) ? '#ef4444' : 'var(--theme-text)'">{{ m }}</span>
                </div>
              </div>
          </div>

          <!-- Content -->
          <div class="space-y-2">
            <label class="block text-[10px] font-black uppercase tracking-widest" style="color:var(--theme-muted)">{{ t('journal.field.content') }}</label>
            <textarea rows="5" formControlName="content" class="luxury-input !py-4 resize-none leading-relaxed" placeholder="What were you thinking...?"></textarea>
          </div>

          <!-- Actions -->
          <div class="mt-8 flex flex-col-reverse sm:flex-row sm:justify-end gap-4 pt-8"
               style="border-top:1px solid var(--theme-border)">
            <button type="button" (click)="onClose()" 
                    class="btn-ghost w-full sm:w-auto px-8 py-4 font-black rounded-2xl">
              {{ t('common.cancel') }}
            </button>
            <button type="submit" [disabled]="journalForm.invalid" 
                    class="btn-gold w-full sm:w-auto px-8 py-4 font-black rounded-2xl shadow-gold">
              {{ t('common.save') }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

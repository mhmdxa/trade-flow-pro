<div class="h-screen w-full flex overflow-hidden" style="background:#0b0c1e;">

  <!-- Fixed background radial gradient -->
  <div class="fixed inset-0 pointer-events-none" style="background:radial-gradient(ellipse at 20% 50%, rgba(29,78,216,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(79,135,255,0.05) 0%, transparent 50%);"></div>

  <!-- Mobile Sidebar Overlay -->
  <div *ngIf="isMobileSidebarOpen" class="fixed inset-0 z-50 flex md:hidden">
    <div class="fixed inset-0" style="background:rgba(11,12,30,0.85); backdrop-filter:blur(4px);" (click)="isMobileSidebarOpen=false"></div>
    <div class="relative w-72 flex-shrink-0 shadow-2xl z-10">
      <app-sidebar [isMobileOpen]="true" (closeMobile)="isMobileSidebarOpen=false" class="h-full block"></app-sidebar>
    </div>
  </div>

  <!-- Desktop Sidebar -->
  <div class="hidden md:flex flex-shrink-0" style="width:260px;">
    <app-sidebar [isMobileOpen]="false" class="w-full h-full block"></app-sidebar>
  </div>

  <!-- Main Area -->
  <div class="flex-1 flex flex-col overflow-hidden relative z-10">
    <app-header (toggleMobileSidebar)="isMobileSidebarOpen=true"></app-header>
    <main class="flex-1 overflow-y-auto custom-scrollbar px-5 py-5">
      <div class="max-w-[1400px] mx-auto animate-fade-in">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
